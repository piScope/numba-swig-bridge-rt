[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numba-swig-bridge-rt"
dynamic = ["version"]
description = "Public Numba runtime for generated SWIG bridges"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["numba>=0.68.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nsb_rt = ["include/*.i", "cpp/*.hpp", "cpp/*.cpp"]

[tool.setuptools.dynamic]
version = {attr = "nsb_rt._version.__version__"}
