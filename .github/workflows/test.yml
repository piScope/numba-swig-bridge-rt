name: Test runtime and generated sample

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation tools
        run: python -m pip install --upgrade pip build twine
      - name: Build runtime wheel
        run: python -m build --wheel --outdir dist .
      - name: Check runtime metadata
        run: python -m twine check dist/*
      - name: Build and test generated sample consumer
        run: |
          python scripts/validate_runtime_consumer.py \
            --runtime-wheel dist/numba_swig_bridge_rt-*.whl \
            --work-dir "$RUNNER_TEMP/runtime-consumer"
